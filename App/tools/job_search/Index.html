<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerSphere | Job Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/common-var2.css">
    
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"> 
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000000;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Left Side - Form */
        .left-panel {
            width: 450px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            height: 100vh;
            
        }

        .form-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 30px;
            padding-left: 70px;
            padding-top: 20vh;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 16px 20px;
            background: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            color: #333;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            box-shadow: 0 0 0 2px #9b51ad;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #9b51ad;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover:not(:disabled) {
            background: #6f3c7c;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Right Side - Results */
        .right-panel {
            flex: 1;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
        }

        .results-header {
            background: #1a1a1a;
            padding: 25px 30px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-header h2 {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .stats {
            display: flex;
            gap: 25px;
            font-size: 0.9rem;
            color: #999;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-weight: 600;
            color: #9b51ad;
            font-size: 1.1rem;
        }

        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
        }

        /* Job Card */
        .job-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .job-card:hover {
            border-color: #9b51ad;
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.2);
            transform: translateY(-2px);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .job-info {
            flex: 1;
        }

        .job-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .job-company {
            color: #9b51ad;
            font-weight: 500;
            font-size: 1rem;
        }

        .ai-rating {
            background: #9b51ad;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.2rem;
            min-width: 75px;
            text-align: center;
        }

        .ai-rating.high {
            background: #9b51ad;
        }

        .ai-rating.medium {
            background: #FF9800;
        }

        .ai-rating.low {
            background: #f44336;
        }

        .job-details {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #999;
        }

        .job-detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-analysis {
            background: #0f0f0f;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 3px solid #9b51ad;
        }

        .ai-analysis-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #9b51ad;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .ai-analysis-text {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .job-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #9b51ad;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .job-link:hover {
            background: #45a049;
        }

        /* Loading and Empty States */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .loading-state {
            text-align: center;
            padding: 100px 20px;
        }

        .loading-state h3 {
            color: #fff;
            margin-bottom: 10px;
        }

        .loading-state p {
            color: #999;
        }

        .loading-spinner {
            border: 4px solid #2a2a2a;
            border-top: 4px solid #9b51ad;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message {
            background: #1a3a1a;
            color: #9b51ad;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #9b51ad;
            font-size: 0.9rem;
        }

        .error-message {
            background: #3a1a1a;
            color: #f44336;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #f44336;
            font-size: 0.9rem;
        }

        /* Scrollbar styling */
        .results-container::-webkit-scrollbar,
        .form-container::-webkit-scrollbar {
            width: 10px;
        }

        .results-container::-webkit-scrollbar-track,
        .form-container::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .results-container::-webkit-scrollbar-thumb,
        .form-container::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 5px;
        }

        .results-container::-webkit-scrollbar-thumb:hover,
        .form-container::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

    </style>
</head>
<body>
        <div class="sidebar">   
        <a href="./Dashboard.html">
            <div class="sidebar-icon">
                <i class="fas fa-th-large"></i>
            </div>
        </a>
            <div class="sidebar-icon">
                <i class="fas fa-chart-line"></i>
            </div>
        <a href="./tools/job_search/Index.html">
            <div class="sidebar-icon">
                <i class="fas fa-search"></i>
            </div>
        </a>    
            <div class="sidebar-icon">
                <i class="fas fa-compass"></i>
            </div>
            <div class="sidebar-icon">
                <i class="fas fa-code"></i>
            </div>
            <div class="sidebar-icon">
                <i class="fas fa-file-alt"></i>
            </div>
            <div class="sidebar-icon">
                <i class="fas fa-robot"></i>
            </div>
    </div>
    <div class="container">
        <!-- Left Panel - Form -->
        <div class="left-panel">
            <div class="form-container">
                <form id="searchForm">
                    <div class="form-group">
                        <input type="text" id="location" placeholder="Location *" required>
                    </div>

                    <div class="form-group">
                        <input type="text" id="skills" placeholder="Skills/Keywords (Comma separated) *" required>
                    </div>

                    <div class="form-group">
                        <select id="jobType">
                            <option value="">Job Type (Any)</option>
                            <option value="Full-time">Full-time</option>
                            <option value="Part-time">Part-time</option>
                            <option value="Contract">Contract</option>
                            <option value="Internship">Internship</option>
                            <option value="Temporary">Temporary</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <select id="experienceLevel">
                            <option value="">Experience Level (Any)</option>
                            <option value="Entry level">Entry level</option>
                            <option value="Associate">Associate</option>
                            <option value="Mid-Senior level">Mid-Senior level</option>
                            <option value="Director">Director</option>
                            <option value="Executive">Executive</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary" id="searchBtn">
                        Search Jobs
                    </button>
                </form>

                <div id="statusContainer" style="margin-top: 25px;"></div>
            </div>
        </div>

        <!-- Right Panel - Results -->
        <div class="right-panel">
            <div class="results-header">
                <div class="stats" id="statsContainer">
                    <div class="stat-item">
                        <span>Total:</span>
                        <span class="stat-value" id="totalJobs">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Avg Rating:</span>
                        <span class="stat-value" id="avgRating">-</span>
                    </div>
                </div>
            </div>

            <div class="results-container" id="resultsContainer">
                <div class="empty-state">
                    <h3>Ready to Search</h3>
                    <p>Enter your location and skills to find matching jobs</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    let currentJobs = [];

    document.getElementById('searchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const location = document.getElementById('location').value.trim();
        const skills = document.getElementById('skills').value.trim();
        const jobType = document.getElementById('jobType').value || "Any";
        const experienceLevel = document.getElementById('experienceLevel').value || "Any";

        if (!location || !skills) {
            showStatus('Please fill in Location and Skills/Keywords', 'error');
            return;
        }

        document.getElementById('searchBtn').disabled = true;
        document.getElementById('searchBtn').textContent = 'Scraping...';
        
        clearResults();
        showLoading("Scraping LinkedIn for up to 250 jobs...");

        try {
            // Step 1: Scrape
            const scrapeRes = await fetch('/api/job_search/scrape', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ location, keywords: skills, job_type: jobType, experience_level: experienceLevel })
            });
            const scrapeData = await scrapeRes.json();
            if (!scrapeData.success) throw new Error(scrapeData.error);

            showLoading("Cleaning and deduplicating jobs...");
            
            // Step 2: Clean
            const cleanRes = await fetch('/api/job_search/clean', { method: 'POST' });
            const cleanData = await cleanRes.json();
            if (!cleanData.success) throw new Error(cleanData.error);

            showLoading(`AI analyzing ${cleanData.count} jobs... This may take 1-2 minutes`);

            // Step 3: Analyze
            const analyzeRes = await fetch('/api/job_search/analyze', { method: 'POST' });
            const analyzeData = await analyzeRes.json();
            if (!analyzeData.success) throw new Error(analyzeData.error);

            currentJobs = analyzeData.jobs;
            displayResults(currentJobs);
            showStatus(`Found ${currentJobs.length} jobs • Sorted by AI rating`, 'success');

        } catch (err) {
            console.error(err);
            showStatus(`Error: ${err.message}`, 'error');
            document.getElementById('resultsContainer').innerHTML = `
                <div class="empty-state">
                    <h3>Search Failed</h3>
                    <p>${err.message}</p>
                </div>
            `;
        } finally {
            document.getElementById('searchBtn').disabled = false;
            document.getElementById('searchBtn').textContent = 'Search Jobs';
        }
    });

    function showLoading(message) {
        document.getElementById('resultsContainer').innerHTML = `
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <h3>${message}</h3>
            </div>
        `;
    }

    function clearResults() {
        document.getElementById('totalJobs').textContent = '0';
        document.getElementById('avgRating').textContent = '-';
    }

    function displayResults(jobs) {
        if (!jobs || jobs.length === 0) {
            document.getElementById('resultsContainer').innerHTML = `
                <div class="empty-state">
                    <h3>No jobs found</h3>
                    <p>Try broader keywords or different location</p>
                </div>
            `;
            return;
        }

        document.getElementById('totalJobs').textContent = jobs.length;
        const avg = Math.round(jobs.reduce((a, b) => a + b.ai_rating, 0) / jobs.length);
        document.getElementById('avgRating').textContent = avg;

        const html = jobs.map(job => {
            const ratingClass = job.ai_rating >= 80 ? 'high' : job.ai_rating >= 60 ? 'medium' : 'low';
            return `
                <div class="job-card" onclick="window.open('${job.link}', '_blank')">
                    <div class="job-header">
                        <div class="job-info">
                            <div class="job-title">${escapeHtml(job.job_title)}</div>
                            <div class="job-company">${escapeHtml(job.company)}</div>
                        </div>
                        <div class="ai-rating ${ratingClass}">${job.ai_rating}</div>
                    </div>
                    <div class="job-details">
                        <div class="job-detail-item">📍 ${escapeHtml(job.location)}</div>
                        <div class="job-detail-item">💼 ${job.job_type}</div>
                        <div class="job-detail-item">📊 ${job.level}</div>
                    </div>
                    <div class="ai-analysis">
                        <div class="ai-analysis-label">AI ANALYSIS</div>
                        <div class="ai-analysis-text">${escapeHtml(job.ai_analysis)}</div>
                    </div>
                    <a href="${job.link}" target="_blank" class="job-link" onclick="event.stopPropagation()">
                        View on LinkedIn →
                    </a>
                </div>
            `;
        }).join('');

        document.getElementById('resultsContainer').innerHTML = html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showStatus(message, type = 'info') {
        const container = document.getElementById('statusContainer');
        const className = type === 'error' ? 'error-message' : 'status-message';
        container.innerHTML = `<div class="${className}">${message}</div>`;
        if (type === 'success') setTimeout(() => container.innerHTML = '', 6000);
    }
</script>
</body>
</html>
